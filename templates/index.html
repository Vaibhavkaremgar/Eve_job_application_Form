<!DOCTYPE html>
<html>
    <head>
        <title>Job Application Form</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
        }

        form {
            width: 400px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: #007BFF;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #999;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: blue;
            outline: none;
            box-shadow: 0 0 5px lightblue;
        }

        input[readonly] {
            background-color: #e9ecef;
            color: #555;
            cursor: default;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #0056b3;
        }

        .logout {
            display: block;
            text-align: right;
            margin: 10px auto;
            width: 400px;
            font-size: 13px;
            color: #888;
        }
        .logout a { color: #007BFF; text-decoration: none; }
        .logout a:hover { text-decoration: underline; }

        .error-box {
            width: 400px;
            margin: 80px auto;
            padding: 30px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
            color: #555;
        }
        .error-box h2 { color: #dc3545; margin-bottom: 10px; }
    </style>
    </head>
    <body>
        <div class="logout"><a href="/auth/logout">Sign out</a></div>
        {% if job_error %}
        <div class="error-box">
            <h2>Job Not Available</h2>
            <p>{{ job_error }}</p>
        </div>
        {% else %}
        <form id="applicationForm" action="/apply" method="POST" enctype="multipart/form-data">
            <h2>Job Application Form</h2>
         <label>Job ID:</label>
         <input type="text" value="{{ job_id }}" readonly><br><br>
         <label>Job Title:</label>
         <input type="text" value="{{ job_title }}" readonly><br><br>
         <label>Company Name:</label>
         <input type="text" value="{{ company_name }}" readonly><br><br>
         <input type="hidden" name="job_id" value="{{ job_id }}">
         <label> Name*:</label>
         <input type="text" name="name" pattern="^[a-zA-Z\s]+$" required><br><br>
         <label>Email*:</label>
         <input type="email" name="email" required><br><br>
         <label>Mobile Number*:</label>
         <input type="text" name="phone" pattern="^\d{10}$" maxlength="10" required><br><br>
         <label>LinkedIn URL:</label>
         <input type="url" name="linkedin_url" id="linkedin_url" required placeholder="https://www.linkedin.com/in/your-profile" pattern="https://(www\.)?linkedin\.com/.*">
         <span id="linkedin_error" style="color:red;font-size:13px;display:none;">Please enter a valid LinkedIn profile URL starting with https://</span><br><br>
         <label>Upload Resume*:</label>
         <input type = "file" name = "resume" id = "resume" accept = ".pdf,.docx" required><br><br>
         <label>Upload Cover Letter:</label>
         <input type = "file" name = "cover_letter" id = "cover_letter" accept = ".pdf,.doc,.docx"><br><br>
         <input type="submit" value="Submit">
        </form>
        {% endif %}
        <script>

const nameField = document.querySelector('input[name="name"]');

nameField.addEventListener("input", function () {
    this.value = this.value.replace(/[^A-Za-z ]/g, "");
});


const mobile = document.querySelector('input[name="phone"]');

mobile.addEventListener("input", function () {
    this.value = this.value.replace(/[^0-9]/g, "");
    if (this.value.length > 10) {
        this.value = this.value.slice(0, 10);
    }
});
const linkedinInput = document.getElementById("linkedin_url");
const linkedinError = document.getElementById("linkedin_error");

linkedinInput.addEventListener("input", function () {
    if (this.value === "" || this.value.startsWith("https://")) {
        linkedinError.style.display = "none";
    }
});

const form = document.getElementById("applicationForm");

form.addEventListener("submit", async function (e) {

    e.preventDefault();

    if (!linkedinInput.value.startsWith("https://")) {
        linkedinError.style.display = "inline";
        linkedinInput.focus();
        return;
    }
    

    const formData = new FormData(form);

    try {
        const response = await fetch("/apply", {
            method: "POST",
            body: formData
        });

        const result = await response.json();

        if (response.ok) {
            alert("Thank you! Your application has been received successfully. If you're shortlisted, we'll contact you with the next steps.");
            form.reset();
        } else {
            alert(result.detail || result.message || "Application submission failed.");
        }
    } catch {
        alert("Application submission failed.");
    }

});
</script>
    </body>
</html>
