<!DOCTYPE html>
<html>
    <head>
        <title>Job Application Form</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            /* background: #f6f9ff url("/static/background.png") center top / cover no-repeat fixed; */
            background-image: url("/static/background.png");
            background-repeat: no-repeat;
            background-position: center center;
            /* background-size: cover; */
            background-size: 100% 100%;
            background-attachment: scroll;
            background-color: #f6f9ff;
            overflow-x: hidden;
            isolation: isolate;
        }

        form {
            width: min(460px, calc(100vw - 32px));
            margin: 0;
            padding: 18px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: #007BFF;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #999;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: blue;
            outline: none;
            box-shadow: 0 0 5px lightblue;
        }

        input[readonly] {
            background-color: #e9ecef;
            color: #555;
            cursor: default;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #0056b3;
        }

        .logout {
            position: absolute;
            top: 16px;
            right: 16px;
            display: block;
            text-align: right;
            margin: 0;
            width: auto;
            font-size: 13px;
            color: #888;
        }
        .logout a { color: #007BFF; text-decoration: none; }
        .logout a:hover { text-decoration: underline; }

        .error-box {
            width: min(460px, calc(100vw - 32px));
            margin: 0;
            padding: 30px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
            color: #555;
        }
        .error-box h2 { color: #dc3545; margin-bottom: 10px; }

        @media (max-width: 520px) {
            body {
                padding: 16px 12px;
                background-attachment: scroll;
            }

            .logout {
                top: 12px;
                right: 12px;
            }

            form,
            .error-box {
                width: 100%;
            }
        }

        @keyframes successPop {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
    </head>
    <body>
        <div class="logout"><a href="/auth/logout">Sign out</a></div>
        {% if job_error %}
        <div class="error-box">
            <h2>Job Not Available</h2>
            <p>{{ job_error }}</p>
        </div>
        {% else %}
        <form id="applicationForm" action="/apply" method="POST" enctype="multipart/form-data">
            <h2>Job Application Form</h2>
         <label>Job ID:</label>
         <input type="text" value="{{ job_id }}" readonly><br><br>
         <label>Job Title:</label>
         <input type="text" value="{{ job_title }}" readonly><br><br>
         <label>Company Name:</label>
         <input type="text" value="{{ company_name }}" readonly><br><br>
         <input type="hidden" name="job_id" value="{{ job_id }}">
         <label> Name*:</label>
         <input type="text" name="name" pattern="^[a-zA-Z\s]+$" required><br><br>
         <label>Email*:</label>
         <input type="email" name="email" required><br><br>
         <label>Mobile Number*:</label>
         <input type="text" name="phone" pattern="^\d{10}$" maxlength="10" required><br><br>
         <label>LinkedIn URL:</label>
         <input type="url" name="linkedin_url" id="linkedin_url" required placeholder="https://www.linkedin.com/in/your-profile"><br><br>
         <label>Upload Resume*:</label>
         <input type = "file" name = "resume" id = "resume" accept = ".pdf,.doc,.docx" required><br><br>
         <label>Upload Cover Letter:</label>
         <input type = "file" name = "cover_letter" id = "cover_letter" accept = ".pdf,.doc,.docx"><br><br>
         <input type="submit" value="Submit">
        </form>
        {% endif %}
        <div id="success-screen" style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; background:rgba(15,23,42,0.48); backdrop-filter: blur(8px); z-index:30;">
            <div style="width:min(92vw,420px); background:rgba(255,255,255,0.96); border-radius:24px; padding:34px 28px; box-shadow:0 24px 70px rgba(15,23,42,0.18); text-align:center; animation:successPop 0.5s ease both;">
                <div style="width:84px; height:84px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(135deg, rgba(22,163,74,0.15), rgba(34,197,94,0.22)); color:#16a34a;">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <h2 style="margin:0 0 10px; color:#0f172a;">Application submitted successfully</h2>
                <p style="margin:0; color:#64748b; line-height:1.7;">Preparing your candidate dashboard now.</p>
                <p style="margin:14px 0 0; color:#1d4ed8; font-weight:700;">Redirecting in 2 seconds...</p>
            </div>
        </div>
        <script>
const successScreen = document.getElementById("success-screen");
const formHost = document.getElementById("applicationForm");
const form = document.getElementById("applicationForm");

if (form) {
    const nameField = document.querySelector('input[name="name"]');
    if (nameField) {
        nameField.addEventListener("input", function () {
            this.value = this.value.replace(/[^A-Za-z ]/g, "");
        });
    }

    const mobile = document.querySelector('input[name="phone"]');
    if (mobile) {
        mobile.addEventListener("input", function () {
            this.value = this.value.replace(/[^0-9]/g, "");
            if (this.value.length > 10) {
                this.value = this.value.slice(0, 10);
            }
        });
    }
    const linkedinInput = document.getElementById("linkedin_url");

    function validateLinkedin() {
        const msg = linkedinInput && linkedinInput.value && !linkedinInput.value.startsWith("https://")
            ? "Please enter a valid LinkedIn profile URL starting with https://"
            : "";
        if (linkedinInput) {
            linkedinInput.setCustomValidity(msg);
        }
    }

    if (linkedinInput) {
        linkedinInput.addEventListener("input", validateLinkedin);
        linkedinInput.addEventListener("invalid", function () {
            if (this.value && !this.value.startsWith("https://")) {
                this.setCustomValidity("Please enter a valid LinkedIn profile URL starting with https://");
            }
        });
    }

    form.addEventListener("submit", async function (e) {

    e.preventDefault();

    validateLinkedin();
    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }
    

    const formData = new FormData(form);

    try {
        const response = await fetch("/apply", {
            method: "POST",
            body: formData
        });

        const result = await response.json();

        if (response.ok) {
            formHost.style.display = "none";
            successScreen.style.display = "flex";
            window.setTimeout(() => {
                window.location.href = result.dashboard_url || "/candidate-dashboard";
            }, 2000);
        } else {
            alert(result.detail || result.message || "Application submission failed.");
        }
        } catch {
            alert("Application submission failed.");
        }

    });
}
</script>
    </body>
</html>
