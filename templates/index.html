<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Job Application Form</title>
        <style>
        :root {
            --page-bg: #faf9f6;
            --ink: #0f172a;
            --muted: #475569;
            --line: rgba(15, 23, 42, 0.10);
            --line-strong: rgba(15, 23, 42, 0.14);
            --field-bg: rgba(255, 255, 255, 0.72);
            --field-bg-disabled: rgba(255, 255, 255, 0.55);
            --focus-ring: rgba(45, 120, 255, 0.24);
            --teal-1: #18b6a8;
            --teal-2: #0f9e90;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background:
                radial-gradient(circle at 50% 18%, rgba(24, 182, 168, 0.10), transparent 34%),
                radial-gradient(circle at 50% 0%, rgba(15, 23, 42, 0.04), transparent 28%),
                linear-gradient(180deg, rgba(250, 249, 246, 0.98), rgba(250, 249, 246, 0.98)),
                var(--page-bg);
            overflow-x: hidden;
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(rgba(15, 23, 42, 0.045) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.55;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.45) 60%, rgba(0, 0, 0, 0.22));
            -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.45) 60%, rgba(0, 0, 0, 0.22));
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 42%, rgba(24, 182, 168, 0.09), transparent 28%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.52), transparent 60%);
            z-index: -1;
        }

        form {
            width: min(650px, calc(100vw - 40px));
            margin: 0;
            padding: 44px 48px 46px;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            color: var(--ink);
        }

        h2 {
            margin: 0 0 28px;
            text-align: center;
            color: var(--ink);
            font-size: 40px;
            line-height: 1.08;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        form label,
        .error-box label {
            display: block;
            margin: 0 0 8px;
            font-weight: 600;
            font-size: 15px;
            line-height: 1.35;
            color: #1e293b;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="url"],
        form input[type="file"] {
            width: 100%;
            min-height: 52px;
            padding: 14px 16px;
            margin: 0 0 18px;
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 16px;
            box-sizing: border-box;
            background: var(--field-bg);
            color: var(--ink);
            font-size: 16px;
            line-height: 1.4;
            font-family: inherit;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
            transition:
                border-color 180ms ease,
                box-shadow 180ms ease,
                background-color 180ms ease,
                transform 180ms ease;
        }

        form input[type="file"] {
            padding-top: 13px;
            padding-bottom: 13px;
        }

        form input::placeholder {
            color: #94a3b8;
        }

        form input:hover {
            border-color: rgba(15, 23, 42, 0.18);
            background: rgba(255, 255, 255, 0.82);
        }

        form input:focus {
            border-color: rgba(37, 99, 235, 0.55);
            outline: none;
            box-shadow: 0 0 0 4px var(--focus-ring);
            background: rgba(255, 255, 255, 0.92);
        }

        form input[readonly],
        form input[disabled] {
            background: var(--field-bg-disabled);
            color: #475569;
            cursor: default;
        }

        form input[readonly]:hover,
        form input[disabled]:hover {
            border-color: rgba(15, 23, 42, 0.12);
            background: var(--field-bg-disabled);
        }

        input[type="submit"] {
            width: 100%;
            min-height: 54px;
            margin-top: 6px;
            padding: 0 18px;
            background: linear-gradient(135deg, var(--teal-1), var(--teal-2));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 14px 28px rgba(15, 158, 144, 0.24);
            transition:
                transform 180ms ease,
                box-shadow 180ms ease,
                filter 180ms ease;
        }

        input[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 34px rgba(15, 158, 144, 0.28);
            filter: brightness(1.02);
        }

        input[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 10px 22px rgba(15, 158, 144, 0.22);
        }

        input[type="submit"]:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(24, 182, 168, 0.24), 0 14px 28px rgba(15, 158, 144, 0.24);
        }

        .logout {
            position: absolute;
            top: 20px;
            right: 20px;
            display: block;
            text-align: right;
            margin: 0;
            width: auto;
            font-size: 13px;
            color: #64748b;
            z-index: 1;
        }
        .logout a {
            color: #0f766e;
            text-decoration: none;
            font-weight: 600;
        }
        .logout a:hover { text-decoration: underline; }

        .error-box {
            width: min(650px, calc(100vw - 40px));
            margin: 0;
            padding: 44px 48px 46px;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            text-align: center;
            color: var(--muted);
        }
        .error-box h2 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        @media (max-width: 520px) {
            body {
                padding: 20px 12px;
            }

            .logout {
                top: 14px;
                right: 14px;
            }

            form,
            .error-box {
                width: 100%;
                padding: 28px 18px 22px;
                border-radius: 20px;
            }

            h2 {
                font-size: 28px;
                margin-bottom: 22px;
            }

            form input[type="text"],
            form input[type="email"],
            form input[type="url"],
            form input[type="file"] {
                min-height: 50px;
                border-radius: 14px;
            }

            input[type="submit"] {
                min-height: 52px;
            }
        }

        @media (min-width: 521px) and (max-width: 900px) {
            form,
            .error-box {
                padding: 38px 34px 34px;
            }

            h2 {
                font-size: 34px;
            }
        }
    </style>
    </head>
    <body>
        <div class="logout"><a href="/auth/logout">Sign out</a></div>
        {% if job_error %}
        <div class="error-box">
            <h2>Job not found</h2>
            <p>{{ job_error }}</p>
        </div>
        {% else %}
        <form id="applicationForm" action="/apply" method="POST" enctype="multipart/form-data">
            <h2>Job Application Form</h2>
         <label>Job Id:</label>
         <input type="text" value="{{ job_id }}" readonly><br><br>
         <label>Job Title:</label>
         <input type="text" value="{{ job_title }}" readonly><br><br>
         <label>Company Name:</label>
         <input type="text" value="{{ company_name }}" readonly><br><br>
         <input type="hidden" name="job_id" value="{{ job_id }}">
         <label> Name*:</label>
         <input type="text" name="name" pattern="^[a-zA-Z\s]+$" required><br><br>
         <label>Email*:</label>
         <input type="email" name="email" required><br><br>
         <label>Mobile Number*:</label>
         <input type="text" name="phone" pattern="^\d{10}$" maxlength="10" required><br><br>
         <label>LinkedIn URL:</label>
         <input type="url" name="linkedin_url" id="linkedin_url" required placeholder="https://www.linkedin.com/in/your-profile"><br><br>
         <label>Upload Resume*:</label>
         <input type = "file" name = "resume" id = "resume" accept = ".pdf,.docx" required><br><br>
         <label>Upload Cover Letter:</label>
         <input type = "file" name = "cover_letter" id = "cover_letter" accept = ".pdf,.doc,.docx"><br><br>
         <input type="submit" value="Submit">
        </form>
        {% endif %}
        <script>

const nameField = document.querySelector('input[name="name"]');

nameField.addEventListener("input", function () {
    this.value = this.value.replace(/[^A-Za-z ]/g, "");
});


const mobile = document.querySelector('input[name="phone"]');

mobile.addEventListener("input", function () {
    this.value = this.value.replace(/[^0-9]/g, "");
    if (this.value.length > 10) {
        this.value = this.value.slice(0, 10);
    }
});
const linkedinInput = document.getElementById("linkedin_url");

function validateLinkedin() {
    const msg = linkedinInput.value && !linkedinInput.value.startsWith("https://")
        ? "Please enter a valid LinkedIn profile URL starting with https://"
        : "";
    linkedinInput.setCustomValidity(msg);
}

linkedinInput.addEventListener("input", validateLinkedin);
linkedinInput.addEventListener("invalid", function () {
    if (this.value && !this.value.startsWith("https://")) {
        this.setCustomValidity("Please enter a valid LinkedIn profile URL starting with https://");
    }
});

const form = document.getElementById("applicationForm");

form.addEventListener("submit", async function (e) {

    e.preventDefault();

    validateLinkedin();
    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }
    
 
    const formData = new FormData(form);

    try {
        console.log("Submitting application...");
        const response = await fetch("/apply", {
            method: "POST",
            body: formData
        });
        console.log("Response Status:", response.status);

        const result = await response.json();

        if (response.ok) {
            if (!window.__applicationSuccessToast) {
                const toast = document.createElement("div");
                toast.id = "applicationSuccessToast";
                toast.style.position = "fixed";
                toast.style.left = "50%";
                toast.style.bottom = "24px";
                toast.style.transform = "translateX(-50%)";
                toast.style.background = "#16a34a";
                toast.style.color = "#fff";
                toast.style.padding = "14px 18px";
                toast.style.borderRadius = "10px";
                toast.style.boxShadow = "0 12px 28px rgba(0, 0, 0, 0.18)";
                toast.style.fontFamily = "Arial, sans-serif";
                toast.style.fontSize = "14px";
                toast.style.lineHeight = "1.5";
                toast.style.zIndex = "9999";
                toast.style.maxWidth = "min(92vw, 520px)";
                toast.style.textAlign = "center";
                toast.style.opacity = "0";
                toast.style.transition = "opacity 0.2s ease";
                toast.textContent = "Thank you! Your application has been received successfully. If you're shortlisted, we'll contact you with the next steps.";
                document.body.appendChild(toast);
                window.__applicationSuccessToast = toast;
            }

            window.__applicationSuccessToast.textContent = "Thank you! Your application has been received successfully. If you're shortlisted, we'll contact you with the next steps.";
            window.__applicationSuccessToast.style.opacity = "1";
            window.clearTimeout(window.__applicationSuccessToastTimer);
            window.__applicationSuccessToastTimer = window.setTimeout(() => {
                if (window.__applicationSuccessToast) {
                    window.__applicationSuccessToast.style.opacity = "0";
                }
            }, 1800);
            window.clearTimeout(window.__applicationRedirectTimer);
            window.__applicationRedirectTimer = window.setTimeout(() => {
                window.location.href = "/candidate-dashboard";
            }, 2000);
            form.reset();
        } else {
            alert(result.detail || result.message || "Application submission failed.");
        }
    } catch {
        alert("Application submission failed.");
    }

});
</script>
    </body>
</html>
